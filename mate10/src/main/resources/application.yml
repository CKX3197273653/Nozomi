spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: mate10
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: mate10-group
      auto-offset-reset: earliest

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.mate.mate10.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  rag:
    top-k: 10
    max-chunk-chars: 400
    chunk-size: 512
    chunk-overlap: 128
    use-heading-split: true
    hybrid-enabled: true
    lucene-dir: ./data/lucene-index
    rerank:
      enabled: true
      model-path: ${RERANK_MODEL_PATH:D:/AIGC/bge-reranker-base/onnx/model.onnx}
      tokenizer-path: ${RERANK_TOKENIZER_PATH:D:/AIGC/bge-reranker-base/tokenizer.json}
      recall-factor: 3
      max-length: 510
  chat:
    max-history-messages: 10
    max-history-chars: 2000
    system-prompt: "你是质检知识助手，回答简洁、准确。"
    agent-session-limit: 4
    agent-history-chars: 3000

tesseract:
  language: "chi_sim"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway,loggers
  prometheus:
    metrics:
      export:
        enabled: true





