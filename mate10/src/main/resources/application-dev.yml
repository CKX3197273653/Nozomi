spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mate10db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  mongodb:
    uri: mongodb://root:root@localhost:27017/mate10db?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-wait: 3000ms
          max-idle: 20
          min-idle: 5
      timeout: 3000ms
  kafka:
    bootstrap-servers: localhost:9092

milvus:
  host: 127.0.0.1
  port: 19530
  username: root
  password: root

tesseract:
  path: ${TESSERACT_PATH:I:\OCR\tesseract-main}
  data-path: ${TESSERACT_DATA_PATH:I:\OCR\tesseract-main\tessdata}

app:
  error:
    detail: true

logging:
  level:
    root: info
    org.mate.mate10: DEBUG

  management:
    endpoint:
      health:
        show-details: always
