  name: CI

  on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]

  jobs:
    # ==================== 后端 ====================
    backend:
      name: 后端构建与测试
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: mate10          # 所有 run 命令都在这个目录执行
      steps:
        - name: 检出代码
          uses: actions/checkout@v4

        - name: 配置 JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven                       # 缓存 Maven 依赖，第二次跑快很多

        - name: 编译并运行单元测试
          run: mvn -B clean test

    # ==================== 前端 ====================
    frontend:
      name: 前端构建
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: mate10-V
      steps:
        - name: 检出代码
          uses: actions/checkout@v4

        - name: 配置 Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: mate10-V/package-lock.json

        - name: 安装依赖
          run: npm ci                          # 比 npm install 快且严格（按 lock 文件装）

        - name: 构建
          run: npm run build